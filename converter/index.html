<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>£ ⇄ € Converter</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root {
  --bg: #f4f7f6; --card: #ffffff; --ink: #10211e; --muted: #5d716d;
  --accent: #0f766e; --accent-ink: #ffffff; --key: #ffffff; --key-press: #dbe7e4;
  --line: #d9e3e0; --active: #e3f4f1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1413; --card: #152220; --ink: #eaf4f2; --muted: #92aaa5;
    --accent: #2dd4bf; --accent-ink: #062b27; --key: #1b2c29; --key-press: #28403c;
    --line: #26393a; --active: #12322f;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 12px);
  max-width: 480px; margin: 0 auto;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.rows { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; position: relative; }
.row {
  background: var(--card); border: 2px solid transparent; border-radius: 18px;
  padding: 14px 18px; display: flex; align-items: center; gap: 12px;
  width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
}
.row.active { border-color: var(--accent); background: var(--active); }
.cur { display: flex; flex-direction: column; min-width: 56px; }
.cur b { font-size: 1.15rem; }
.cur small { color: var(--muted); font-size: .72rem; }
.amt {
  flex: 1; text-align: right; font-size: clamp(1.9rem, 9vw, 2.6rem); font-weight: 650;
  font-variant-numeric: tabular-nums; overflow: hidden; white-space: nowrap;
}
.row:not(.active) .amt { color: var(--muted); }
.swap {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--bg);
  background: var(--accent); color: var(--accent-ink); font-size: 1.2rem; cursor: pointer; z-index: 1;
}
.rate { text-align: center; margin: 14px 0 4px; }
.rate .main { font-size: 1.1rem; font-weight: 600; }
.rate .sub { color: var(--muted); font-size: .78rem; margin-top: 3px; line-height: 1.35; }
.pad {
  flex: 1; min-height: 0; margin-top: 10px; display: grid;
  grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px;
}
.pad button {
  border: 0; border-radius: 16px; background: var(--key); color: var(--ink);
  font: inherit; font-size: 1.9rem; font-weight: 500; cursor: pointer;
  box-shadow: 0 1px 0 var(--line);
}
.pad button:active { background: var(--key-press); }
.pad .fn { color: var(--muted); font-size: 1.5rem; }
.toast { color: var(--muted); }
</style>
</head>
<body>
<div class="rows">
  <button class="row active" id="row-GBP" data-cur="GBP" aria-label="Pounds">
    <span class="cur"><b>🇬🇧 GBP</b><small>Pounds</small></span><span class="amt" id="amt-GBP">0</span>
  </button>
  <button class="swap" id="swap" aria-label="Swap direction">⇅</button>
  <button class="row" id="row-EUR" data-cur="EUR" aria-label="Euros">
    <span class="cur"><b>🇪🇺 EUR</b><small>Euros</small></span><span class="amt" id="amt-EUR">0</span>
  </button>
</div>

<div class="rate">
  <div class="main" id="rate-main">Loading rate…</div>
  <div class="sub" id="rate-sub"></div>
</div>

<div class="pad" id="pad">
  <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
  <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
  <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
  <button data-k=".">.</button><button data-k="0">0</button>
  <button class="fn" data-k="back" aria-label="Backspace">⌫</button>
</div>

<script>
(() => {
  const FALLBACK = 1.15;          // used only if there has never been a successful fetch
  const STORE = 'gbp-eur-rate-v1';
  const state = { active: 'GBP', input: '', rate: FALLBACK, asOf: null, source: 'fallback' };

  const $ = (id) => document.getElementById(id);
  const fmt = (n, dp) => n.toLocaleString('en-GB', { minimumFractionDigits: dp, maximumFractionDigits: dp });

  function formatInput(s) {
    if (!s) return '0';
    const [int, dec] = s.split('.');
    const i = Number(int || 0).toLocaleString('en-GB');
    return dec === undefined ? i : i + '.' + dec;
  }

  function render() {
    const other = state.active === 'GBP' ? 'EUR' : 'GBP';
    const val = parseFloat(state.input || '0');
    const factor = state.active === 'GBP' ? state.rate : 1 / state.rate;
    $('amt-' + state.active).textContent = formatInput(state.input);
    $('amt-' + other).textContent = fmt(val * factor, 2);
    $('row-GBP').classList.toggle('active', state.active === 'GBP');
    $('row-EUR').classList.toggle('active', state.active === 'EUR');
    $('rate-main').textContent = `£1 = €${state.rate.toFixed(4)}  ·  €1 = £${(1 / state.rate).toFixed(4)}`;
    const when = state.asOf ? new Date(state.asOf).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : null;
    $('rate-sub').textContent = state.source === 'fallback'
      ? 'Offline estimate – no live rate yet. Connect to refresh.'
      : `Mastercard-style rate (no card fee), ${when}${state.source === 'cache' ? ' · saved' : ''}.`;
  }

  function press(k) {
    let s = state.input;
    if (k === 'back') s = s.slice(0, -1);
    else if (k === '.') { if (!s.includes('.')) s = (s || '0') + '.'; }
    else {
      const [int, dec] = s.split('.');
      if (dec !== undefined && dec.length >= 2) return;
      if (dec === undefined && int.length >= 9) return;
      s = s === '0' ? k : s + k;
    }
    state.input = s;
    if (navigator.vibrate) navigator.vibrate(8);
    render();
  }

  function setActive(cur) {
    if (cur === state.active) return;
    // carry the converted figure across so swapping keeps the numbers on screen
    const val = parseFloat(state.input || '0');
    const factor = state.active === 'GBP' ? state.rate : 1 / state.rate;
    const out = val * factor;
    state.input = val ? String(Math.round(out * 100) / 100) : '';
    state.active = cur;
    render();
  }

  $('pad').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
  document.querySelectorAll('.row').forEach((r) => r.addEventListener('click', () => setActive(r.dataset.cur)));
  $('swap').addEventListener('click', () => setActive(state.active === 'GBP' ? 'EUR' : 'GBP'));
  document.addEventListener('keydown', (e) => {
    if (/^[0-9.]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') press('back');
  });

  // Rate: Halifax Clarity (and similar no-fee cards) use the Mastercard network rate,
  // which has no public API. The ECB reference rate from Frankfurter tracks it very closely.
  async function loadRate() {
    try {
      const c = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (c && c.rate) { Object.assign(state, { rate: c.rate, asOf: c.date, source: 'cache' }); render(); }
    } catch (_) {}
    try {
      const r = await fetch('https://api.frankfurter.dev/v1/latest?base=GBP&symbols=EUR', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const j = await r.json();
      const rate = j.rates && j.rates.EUR;
      if (!rate) throw new Error('no rate');
      Object.assign(state, { rate, asOf: j.date, source: 'live' });
      try { localStorage.setItem(STORE, JSON.stringify({ rate, date: j.date })); } catch (_) {}
    } catch (_) { /* keep cached / fallback */ }
    render();
  }

  render();
  loadRate();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
